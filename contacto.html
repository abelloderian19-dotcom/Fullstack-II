<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Pastelería Mil Sabores</title>
</head>
<body>
    <!--COPIAR Y PEGAR NAV EXISTENTE-->
    <header class="header-contacto">
        <img src="https://placehold.co/150x150?text=LOGO" alt="Logo Pastelería Mil Sabores">
        <h1>Pastelería Mil Sabores</h1>
    </header>
    <main>
        <section class="formulario-contacto">
            <h2>FORMULARIO DE CONTACTOS</h2>
            <form action="">
                <label for="nombre">NOMBRE COMPLETO</label>
                <input type="text" id="nombre">

                <label for="correo">CORREO</label>
                <input type="email" id="correo">

                <label for="contenido">CONTENIDO</label>
                <textarea name="" id="contenido"></textarea>

                <button type="submit">ENVIAR MENSAJE</button>
            </form>
        </section>
    </main>
</body>
</html>
