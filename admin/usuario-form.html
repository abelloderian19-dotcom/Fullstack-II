<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuario - Administrador - Pastelería Mil Sabores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../styles/global-styles.css">
    <link rel="stylesheet" href="../styles/admin.css">
</head>

<body>
    <div class="container-fluid">
        <div class="row">

            <!-- Menú lateral -->
            <aside class="col-md-3 col-lg-2 sidebar p-0">
                <header class="sidebar-header text-center p-3">
                    <a href="index.html">
                        <img src="../img/logo-tienda.svg" alt="Logo Pastelería Mil Sabores" class="sidebar-logo">
                    </a>
                    <h2 class="fs-4 mt-2">Mil Sabores</h2>
                    <span class="texto-secundario">Administrador</span>
                </header>
                <nav class="nav flex-column">
                    <a class="nav-link" href="index.html">
                        Inicio
                    </a>
                    <a class="nav-link" href="productos.html">
                        Productos
                    </a>
                    <a class="nav-link active" href="usuarios.html">
                        Usuarios
                    </a>
                    <a class="nav-link" href="../index.html">
                        Ver tienda
                    </a>
                    <a class="nav-link" href="../login.html">
                        Cerrar sesión
                    </a>
                </nav>
            </aside>

            <!-- Contenido -->
            <div class="col-md-9 col-lg-10 d-flex flex-column min-vh-100">
                <main class="flex-grow-1 p-4">
                    <section>
                        <h1 id="titulo-formulario">Nuevo usuario</h1>
                        <p class="texto-secundario">Los campos marcados con * son obligatorios</p>
                    </section>

                    <section>
                        <form id="form-usuario" class="row g-3" novalidate>

                            <div class="col-md-4">
                                <label for="run" class="form-label">RUN *</label>
                                <input type="text" class="form-control" id="run" name="run"
                                    placeholder="Sin puntos ni guion, ej: 12345678K" maxlength="9">
                                <div class="invalid-feedback"></div>
                            </div>

                            <div class="col-md-4">
                                <label for="nombre" class="form-label">Nombre *</label>
                                <input type="text" class="form-control" id="nombre" name="nombre"
                                    placeholder="Ej: Ana">
                                <div class="invalid-feedback"></div>
                            </div>

                            <div class="col-md-4">
                                <label for="apellidos" class="form-label">Apellidos *</label>
                                <input type="text" class="form-control" id="apellidos" name="apellidos"
                                    placeholder="Ej: Pérez Soto">
                                <div class="invalid-feedback"></div>
                            </div>

                            <div class="col-md-6">
                                <label for="correo" class="form-label">Correo *</label>
                                <input type="email" class="form-control" id="correo" name="correo"
                                    placeholder="Ej: ana.perez@duoc.cl">
                                <div class="invalid-feedback"></div>
                            </div>

                            <div class="col-md-3">
                                <label for="password" class="form-label">Contraseña *</label>
                                <input type="password" class="form-control" id="password" name="password"
                                    placeholder="Entre 4 y 10 caracteres">
                                <div class="invalid-feedback"></div>
                            </div>

                            <div class="col-md-3">
                                <label for="fechaNacimiento" class="form-label">Fecha de nacimiento</label>
                                <input type="date" class="form-control" id="fechaNacimiento" name="fechaNacimiento">
                                <div class="invalid-feedback"></div>
                            </div>

                            <div class="col-md-4">
                                <label for="tipoUsuario" class="form-label">Tipo de usuario *</label>
                                <select class="form-select" id="tipoUsuario" name="tipoUsuario">
                                    <option value="">Selecciona un tipo</option>
                                </select>
                                <div class="invalid-feedback"></div>
                            </div>

                            <div class="col-md-4">
                                <label for="region" class="form-label">Región *</label>
                                <select class="form-select" id="region" name="region">
                                    <option value="">Selecciona una región</option>
                                </select>
                                <div class="invalid-feedback"></div>
                            </div>

                            <div class="col-md-4">
                                <label for="comuna" class="form-label">Comuna *</label>
                                <select class="form-select" id="comuna" name="comuna" disabled>
                                    <option value="">Primero selecciona una región</option>
                                </select>
                                <div class="invalid-feedback"></div>
                            </div>

                            <div class="col-12">
                                <label for="direccion" class="form-label">Dirección *</label>
                                <input type="text" class="form-control" id="direccion" name="direccion"
                                    placeholder="Ej: Av. Libertador Bernardo O'Higgins 1234">
                                <div class="invalid-feedback"></div>
                            </div>

                            <div class="col-12 d-flex gap-2">
                                <button type="submit" class="btn btn-primary" id="btn-guardar">Guardar usuario</button>
                                <a href="usuarios.html" class="btn btn-secondary">Cancelar</a>
                            </div>

                        </form>
                    </section>
                </main>

                <footer class="text-center p-3">
                    <p class="mb-0 texto-secundario">© 2026 Pastelería Mil Sabores - Panel de administración</p>
                </footer>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="../js/data/usuarios.js"></script>
    <script src="../js/data/regiones.js"></script>
    <script src="../js/storage.js"></script>
    <script src="../js/validators.js"></script>
    <script src="../js/admin/usuario-form.js"></script>
</body>

</html>
