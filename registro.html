<!DOCTYPE html>

</head>
<body>
    <!-- Espacio para el NAV (creo que debemos usar el mismo en cada interfaz, y nos aseguramos de una navegación más limpia)-->

        <section class="formulario-registro">
            <h1>Registro de Usuario</h1>
            <form action=""> <!--creo que acá linkeamos-->
                <label for="">Nombre completo</label>
                <input type="text">

                <label for="">Correo</label>
                <input type="email">

                <label for="">Contraseña</label>
                <input type="password">

                <label for="">Confirmar contraseña</label>
                <input type="password">

                <label for="">Teléfono (opcional)</label>

                <label for="">Región</label>
                <select name="" id="">
                    <option value="">-- Seleccione la región --</option>
                </select>

                <label for="">Comuna</label>
                <select name="" id="">
                    <option value="">-- Selecciones la comuna --</option>
                </select>

                <button type="submit">Regitrar</button>
            </form>
        </section>
    </main>
