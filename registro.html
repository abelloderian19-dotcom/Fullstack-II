<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario - Pastelería Mil Sabores</title>
</head>
<body>
    <!-- Espacio para el NAV (creo que debemos usar el mismo en cada interfaz, y nos aseguramos de una navegación más limpia)-->
    <main> <!--main es lo más importante de una página, y esta pág es sólo para el registro, por ende acá irá el formulario del registro ;) sólo puede haber 1 x pag No puede contener header o footer-->
        <section class="formulario-registro">
            <h1>Registro de Usuario</h1>
            <form action=""> <!--creo que acá linkeamos-->
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre">

                <label for="correo">Correo</label>
                <input type="email" id="correo">

                <label for="password">Contraseña</label>
                <input type="password" id="password">

                <label for="confirmar-password">Confirmar contraseña</label>
                <input type="password" id="confirmar-password">

                <label for="telefono">Teléfono (opcional)</label>
                <input type="tel" id="telefono">

                <label for="region">Región</label>
                <select name="" id="region">
                    <option value="">-- Seleccione la región --</option>
                </select>

                <label for="comuna">Comuna</label>
                <select name="" id="comuna">
                    <option value="">-- Selecciones la comuna --</option>
                </select>

                <button type="submit">Regitrar</button>
            </form>
        </section>
    </main>


</body>
</html>
