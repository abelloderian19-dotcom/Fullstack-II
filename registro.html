<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario | Pastelería Mil Sabores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./styles/global-styles.css">
</head>
<body>
    <!-- Espacio para el NAV (creo que debemos usar el mismo en cada interfaz, y nos aseguramos de una navegación más limpia)-->
    <header class="bg-secondary-subtle border-bottom">
        <div class="container">
            <nav class="d-flex flex-wrap align-items-center justify-content-between gap-3 py-3" aria-label="Navegación principal">
                <a class="navbar-brand d-flex align-items-center gap-2 fw-semibold text-decoration-none" href="./index.html" aria-label="Pastelería 1000 Sabores, inicio">
                    <img src="./img/logo-tienda.svg" alt="" width="42" height="42">
                    <span>Pastelería 1000 Sabores</span>
                </a>
                <ul class="nav flex-grow-1 justify-content-center gap-1">
                    <li class="nav-item"><a class="nav-link px-2" href="./index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link px-2" href="./productos.html">Productos</a></li>
                    <li class="nav-item"><a class="nav-link px-2" href="./nosotros.html">Nosotros</a></li>
                    <li class="nav-item"><a class="nav-link px-2" href="./blogs.html">Blogs</a></li>
                    <li class="nav-item"><a class="nav-link px-2" href="./contacto.html">Contacto</a></li>
                </ul>
                <a class="d-flex align-items-center gap-2 fw-semibold text-decoration-none" href="./carrito.html" aria-label="Carrito de compras">
                    <span aria-hidden="true">🛒</span>
                    <span>Carrito (<span id="cart-count" aria-live="polite">0</span>)</span>
                </a>
            </nav>
        </div>
    </header>
    
    <main class="container d-flex justify-content-center py-5">
        <section class="col-12 col-sm-8 col-md-6 col-lg-5 col-xl-4" aria-labelledby="registro-title">
            <form class="card bg-light border-dark rounded-0 p-3 p-md-4" id="form-registro" action="#" method="post">
                <h2 id="registro-title" class="fs-6 fw-bold px-2 py-2 mb-3 bg-secondary-subtle">Registro de usuario</h2>
                <div class="d-grid gap-3">

                    <div class="d-grid gap-1">
                        <label class="form-label small text-uppercase mb-0" for="reg-nombre">Nombre completo</label>
                        <input class="form-control form-control-sm rounded-0 border-dark" id="reg-nombre" name="nombre" type="text" required>
                    </div>

                    <div class="d-grid gap-1">
                        <label class="form-label small text-uppercase mb-0" for="reg-apellidos">Apellidos</label>
                        <input class="form-control form-control-sm rounded-0 border-dark" id="reg-apellidos" name="apellidos" type="text" required>
                    </div>

                    <div class="d-grid gap-1">
                        <label class="form-label small text-uppercase mb-0" for="reg-email">Correo</label>
                        <input class="form-control form-control-sm rounded-0 border-dark" id="reg-email" name="correo" type="email" autocomplete="username" required>
                    </div>

                    <div class="d-grid gap-1">
                        <label class="form-label small text-uppercase mb-0" for="reg-password">Contraseña</label>
                        <input class="form-control form-control-sm rounded-0 border-dark" id="reg-password" name="password" type="password" autocomplete="new-password" required>
                    </div>

                    <div class="d-grid gap-1">
                        <label class="form-label small text-uppercase mb-0" for="reg-confirmar-password">Confirmar contraseña</label>
                        <input class="form-control form-control-sm rounded-0 border-dark" id="reg-confirmar-password" name="confirmar-password" type="password" autocomplete="new-password" required>
                    </div>

                    <div class="d-grid gap-1">
                        <label class="form-label small text-uppercase mb-0" for="reg-telefono">Teléfono (opcional)</label>
                        <input class="form-control form-control-sm rounded-0 border-dark" id="reg-telefono" name="telefono" type="tel">
                    </div>

                    <div class="row g-3">
                        <div class="col-6 d-grid gap-1">
                            <label class="form-label small text-uppercase mb-0" for="reg-region">Región</label>
                            <select class="form-select form-select-sm rounded-0 border-dark" id="reg-region" name="region" required>
                                <option value="">-- Seleccione la región --</option>
                            </select>
                        </div>
                        <div class="col-6 d-grid gap-1">
                            <label class="form-label small text-uppercase mb-0" for="reg-comuna">Comuna</label>
                            <select class="form-select form-select-sm rounded-0 border-dark" id="reg-comuna" name="comuna" required disabled>
                                <option value="">-- Seleccione la comuna --</option>
                            </select>
                        </div>
                    </div>

                    <div class="d-flex justify-content-center">
                       <button class="btn btn-primary"  type="submit">Registrar</button>
                    </div>
                </div>
            </form>
        </section>
    </main>

    <script src="./js/data/productos.js"></script>
    <script src="./js/carrito.js"></script>
    <script src="./js/data/regiones.js"></script>
    <script src="./js/registro.js"></script>
</body>
</html>
