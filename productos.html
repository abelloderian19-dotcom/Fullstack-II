<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explora todos los productos de Pastelería 1000 Sabores.">
    <title>Productos | Pastelería 1000 Sabores</title>
    <link rel="stylesheet" href="./styles/index.css">
    <link rel="stylesheet" href="./styles/global-styles.css">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <nav id="navbar" aria-label="Navegación principal">
                <a class="logo" href="./index.html" aria-label="Pastelería 1000 Sabores, inicio">
                    <img class="logo-image" src="./img/logo-tienda.svg" alt="">
                    <span class="logo-text">Pastelería 1000 Sabores</span>
                </a>
                <ul class="links">
                    <li><a class="link" href="./index.html">Inicio</a></li>
                    <li><a class="link active" href="./productos.html" aria-current="page">Productos</a></li>
                    <li><a class="link" href="./index.html#nosotros">Nosotros</a></li>
                    <li><a class="link" href="./index.html#blog">Blogs</a></li>
                    <li><a class="link" href="./contacto.html">Contacto</a></li>
                </ul>
                <a class="carrito" href="./carrito.html" aria-label="Carrito de compras">
                    <span class="carrito-icon" aria-hidden="true">🛒</span>
                    <span>Carrito (<span id="cart-count" aria-live="polite">0</span>)</span>
                </a>
            </nav>
        </div>
    </header>

    <main class="container catalog-page">
        <div class="catalog-heading">
            <h1>Productos</h1>
            <p>Descubre nuestra variedad de tortas y pasteles.</p>
        </div>
        <section id="product-catalog" class="products-grid" aria-label="Todos los productos"></section>
    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <div class="footer-left">
                <div class="footer-brand">
                    <span>Pastelería 1000 Sabores</span>
                </div>
                <div class="payment-icons" aria-label="Medios de pago">
                    <span class="payment-icon"><span class="visa-logo">VISA</span></span>
                    <span class="payment-icon"><span class="cash-icon" aria-hidden="true">💵</span> EFECTIVO</span>
                </div>
            </div>
            <div class="suscribe">
                <p>¡Mantente en contacto! Únete a nuestro boletín</p>
                <form action="/suscribirse" method="POST">
                    <input type="email" id="email-input" name="email" placeholder="Ingresa tu correo electrónico" autocomplete="email" required>
                    <button type="submit">Suscribirse</button>
                </form>
            </div>
        </div>
    </footer>

    <script src="./js/data/productos.js"></script>
    <script src="./js/carrito.js"></script>
    <script src="./js/tarjetasProductos.js"></script>
    <script src="./js/listadoProductos.js"></script>
</body>
</html>
