<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explora todos los productos de Pastelería 1000 Sabores.">
    <title>Productos | Pastelería 1000 Sabores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./styles/global-styles.css">
</head>
<body class="bg-white text-dark">
    <header class="bg-secondary-subtle border-bottom border-dark">
        <div class="container">
            <nav class="d-flex flex-wrap align-items-center gap-3 py-3" aria-label="Navegación principal">
                <a class="navbar-brand d-flex align-items-center gap-2 fw-semibold text-dark text-decoration-none" href="./index.html" aria-label="Pastelería 1000 Sabores, inicio">
                    <img src="./img/logo-tienda.svg" alt="" width="36" height="36">
                    <span>Pastelería 1000 Sabores</span>
                </a>
                <ul class="nav flex-grow-1 justify-content-center">
                    <li class="nav-item"><a class="nav-link link-primary px-2" href="./index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link link-primary px-2 active" href="./productos.html" aria-current="page">Productos</a></li>
                    <li class="nav-item"><a class="nav-link link-primary px-2" href="./nosotros.html">Nosotros</a></li>
                    <li class="nav-item"><a class="nav-link link-primary px-2" href="./blogs.html">Blogs</a></li>
                    <li class="nav-item"><a class="nav-link link-primary px-2" href="./contacto.html">Contacto</a></li>
                </ul>
                <a class="d-flex align-items-center gap-2 text-dark text-decoration-none" href="./carrito.html" aria-label="Carrito de compras">
                    <span class="fs-5" aria-hidden="true">🛒</span>
                    <span>Cart (<span id="cart-count" aria-live="polite">0</span>)</span>
                </a>
            </nav>
        </div>
    </header>

    <main class="container py-4">
        <h1 class="h5 text-center text-uppercase mb-3">Productos</h1>
        <section id="product-catalog" class="row g-3 g-lg-4" aria-label="Todos los productos"></section>
    </main>

    <footer class="border-top bg-light mt-4 py-4">
        <div class="container d-flex flex-column flex-md-row justify-content-between align-items-start gap-4">
            <div>
                <div class="fw-semibold mb-3">Pastelería 1000 Sabores</div>
                <div class="d-flex gap-2" aria-label="Medios de pago">
                    <span class="border rounded px-2 py-1 small"><span class="fw-bold fst-italic text-primary">VISA</span></span>
                    <span class="border rounded px-2 py-1 small"><span aria-hidden="true">💵</span> EFECTIVO</span>
                </div>
            </div>
            <div class="footer-newsletter">
                <p class="fw-semibold mb-2">¡Mantente en contacto! Únete a nuestro boletín</p>
                <form class="d-flex gap-2" action="/suscribirse" method="POST">
                    <input class="form-control form-control-sm" type="email" id="email-input" name="email" placeholder="Ingresa tu correo electrónico" autocomplete="email" required>
                    <button class="btn btn-primary btn-sm flex-shrink-0" type="submit">Suscribirse</button>
                </form>
            </div>
        </div>
    </footer>

    <script src="./js/data/productos.js"></script>
    <script src="./js/carrito.js"></script>
    <script src="./js/tarjetasProductos.js"></script>
    <script src="./js/listadoProductos.js"></script>
</body>
</html>
