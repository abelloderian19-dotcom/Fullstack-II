<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login de Usuario - Pastelería Mil Sabores</title>
</head>
<body>
    <!--COPIAR Y PEGA EL NAV DEL HOME PRINCIPAL-->
    <header class="header-login">
        <!--en src la url de la imagen, en alt logo de la pastelería-->
        <img src="https://placehold.co/150x150?text=LOGO" alt="Logo Pastelería Mil Sabores">
        <h1>Pastelería Mil Sabores</h1>
    </header>
    <main>
        <section>
            <h1>Inicio de sesión</h1>
            <form action="">
                <label for="correo">Correo</label>
                <input type="email" id="correo">

                <label for="password">Contraseña</label>
                <input type="password" id="password">

                <button type="submit">Iniciar sesión</button>
            </form>
        </section>
    </main>
</body>
</html>
