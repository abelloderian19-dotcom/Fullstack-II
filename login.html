<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Inicia sesión en Pastelería 1000 Sabores.">
    <title>Iniciar sesión | Pastelería 1000 Sabores</title>
    <link rel="stylesheet" href="./styles/index.css">
    <link rel="stylesheet" href="./styles/global-styles.css">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <nav id="navbar" aria-label="Navegación principal">
                <a class="logo" href="./index.html" aria-label="Pastelería 1000 Sabores, inicio">
                    <img class="logo-image" src="./img/logo-tienda.svg" alt="">
                    <span class="logo-text">Pastelería 1000 Sabores</span>
                </a>
                <ul class="links">
                    <li><a class="link" href="./index.html">Inicio</a></li>
                    <li><a class="link" href="./productos.html">Productos</a></li>
                    <li><a class="link" href="./nosotros.html">Nosotros</a></li>
                    <li><a class="link" href="./blogs.html">Blogs</a></li>
                    <li><a class="link" href="./contacto.html">Contacto</a></li>
                </ul>
                <a class="carrito" href="./carrito.html" aria-label="Carrito de compras">
                    <span class="carrito-icon" aria-hidden="true">🛒</span>
                    <span>Carrito (<span id="cart-count" aria-live="polite">0</span>)</span>
                </a>
            </nav>
        </div>
    </header>

    <main class="container login-page">
        <section class="login-panel" aria-labelledby="login-title">
            <div class="login-brand-mark">
                <img src="./img/logo-tienda.svg" alt="Logo de Pastelería 1000 Sabores">
            </div>
            <h1 class="login-brand-name">Pastelería 1000 Sabores</h1>

            <form class="login-form" id="login-form" novalidate>
                <h2 id="login-title">Inicio de sesión</h2>
                <div class="login-fields">
                    <div class="login-field">
                        <label for="login-email">Correo</label>
                        <input id="login-email" name="correo" type="email" autocomplete="username" aria-describedby="login-feedback" required>
                    </div>
                    <div class="login-field">
                        <label for="login-password">Contraseña</label>
                        <input id="login-password" name="password" type="password" autocomplete="current-password" aria-describedby="login-feedback" required>
                    </div>
                    <p class="login-feedback" id="login-feedback" role="status" aria-live="polite"></p>
                    <button class="login-submit" type="submit">Iniciar sesión</button>
                </div>
            </form>
        </section>
    </main>

    <script src="./js/data/productos.js"></script>
    <script src="./js/carrito.js"></script>
    <script src="./js/data/usuarios.js"></script>
    <script src="./js/storage.js"></script>
    <script src="./js/login.js"></script>
</body>
</html>
