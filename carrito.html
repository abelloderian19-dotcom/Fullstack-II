<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Revisa los productos de tu carrito de compras.">
    <title>Mi carrito | Pastelería 1000 Sabores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./styles/global-styles.css">
</head>
<body class="bg-white text-dark">
    <header class="bg-secondary-subtle border-bottom border-dark">
        <div class="container">
            <nav class="d-flex flex-wrap align-items-center gap-3 py-3" aria-label="Navegación principal">
                <a class="navbar-brand d-flex align-items-center gap-2 fw-semibold text-dark text-decoration-none order-1" href="./index.html" aria-label="Pastelería 1000 Sabores, inicio">
                    <img src="./img/logo-tienda.svg" alt="" width="36" height="36">
                    <span>Pastelería 1000 Sabores</span>
                </a>
                <ul class="nav order-3 order-lg-2 flex-grow-1 flex-lg-fill justify-content-center gap-1 col-12 col-lg-auto">
                    <li class="nav-item"><a class="nav-link link-primary px-2" href="./index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link link-primary px-2" href="./productos.html">Productos</a></li>
                    <li class="nav-item"><a class="nav-link link-primary px-2" href="./nosotros.html">Nosotros</a></li>
                    <li class="nav-item"><a class="nav-link link-primary px-2" href="./blogs.html">Blogs</a></li>
                    <li class="nav-item"><a class="nav-link link-primary px-2" href="./contacto.html">Contacto</a></li>
                </ul>
                <a class="carrito d-flex align-items-center gap-2 text-dark text-decoration-none text-nowrap order-2 order-lg-3 ms-auto" href="./carrito.html" aria-current="page" aria-label="Carrito de compras">
                    <span class="fs-5" aria-hidden="true">🛒</span>
                    <span>Carrito (<span id="cart-count" aria-live="polite">0</span>)</span>
                </a>
            </nav>
        </div>
    </header>

    <main class="container py-4 py-lg-5">
        <h1 class="h2 text-primary mb-4">Mi carrito de compras</h1>
        <div class="row g-4">
            <section class="col-12 col-lg-8" aria-label="Productos del carrito">
                <p id="cart-empty" class="alert alert-light border" hidden>Tu carrito está vacío.</p>
                <a id="cart-back-to-products" class="btn btn-primary" href="./productos.html">← Regresar a productos</a>
                <ul id="cart-items" class="list-group list-group-flush" aria-live="polite"></ul>
                <button id="clear-cart" class="btn btn-outline-danger mt-3" type="button">Vaciar carrito</button>
            </section>
            <aside class="col-12 col-lg-4" aria-label="Resumen de compra">
                <div class="card border-secondary-subtle rounded-0">
                    <div class="card-body p-3 p-md-4">
                        <h2 class="h5 text-primary mb-3">Resumen</h2>
                        <p class="d-flex justify-content-between gap-3 border-top pt-3 mb-4"><span>Total:</span><strong id="cart-total">$0</strong></p>
                        <button class="btn btn-primary w-100" type="button" disabled>Continuar compra</button>
                    </div>
                </div>
            </aside>
        </div>
    </main>

    <footer class="border-top bg-light mt-4 py-4">
        <div class="container d-flex flex-column flex-md-row justify-content-between align-items-start gap-4">
            <div>
                <div class="fw-semibold mb-3">Pastelería 1000 Sabores</div>
                <div class="d-flex gap-2" aria-label="Medios de pago">
                    <span class="border rounded px-2 py-1 small"><span class="fw-bold fst-italic text-primary">VISA</span></span>
                    <span class="border rounded px-2 py-1 small"><span aria-hidden="true">💵</span> EFECTIVO</span>
                </div>
            </div>
            <div class="footer-newsletter">
                <p class="fw-semibold mb-2">¡Mantente en contacto! Únete a nuestro boletín</p>
                <form class="d-flex gap-2" action="/suscribirse" method="POST">
                    <input class="form-control form-control-sm" type="email" name="email" placeholder="Ingresa tu correo electrónico" autocomplete="email" required>
                    <button class="btn btn-primary btn-sm flex-shrink-0" type="submit">Suscribirse</button>
                </form>
            </div>
        </div>
    </footer>

    <script src="./js/data/productos.js"></script>
    <script src="./js/carrito.js"></script>
</body>
</html>
